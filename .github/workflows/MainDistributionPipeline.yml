#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: hdfs
      # The Rust FFI bridge (hdfs-bridge) is built via Corrosion during cmake.
      extra_toolchains: "rust"
      # hdfs-native depends on tokio (async networking), which cannot target
      # WebAssembly, and the rustls/aws-lc TLS stack is not built for Windows
      # here. Restrict to the Linux/macOS desktop+server platforms.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: hdfs
      format_checks: "format;tidy"
      # clang-tidy configures the cmake build, which builds the Rust bridge.
      extra_toolchains: "rust"

  release:
    name: Publish GitHub Release
    # Runs only for pushed tags like v0.1.0, after the build (and its tests) succeed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - duckdb-stable-build
      - code-quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hdfs-v1.5.5-extension-*
          path: artifacts

      - name: Collect per-platform binaries
        run: |
          mkdir -p dist
          for dir in artifacts/hdfs-v1.5.5-extension-*; do
            arch="${dir#artifacts/hdfs-v1.5.5-extension-}"
            cp "$dir/hdfs.duckdb_extension" "dist/hdfs.duckdb_extension.v1.5.5.${arch}"
            gzip -k "dist/hdfs.duckdb_extension.v1.5.5.${arch}"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
